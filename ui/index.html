<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>Notepad MD</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="tabbar" class="tabbar hidden"></div>

  <div id="toolbar" class="toolbar hidden">
    <div class="tb-group">
      <button data-cmd="undo" title="Undo">&#8634;</button>
      <button data-cmd="redo" title="Redo">&#8635;</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="toggle-line-numbers" title="Toggle line numbers">#</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-heading="1" title="Heading 1">H1</button>
      <button data-heading="2" title="Heading 2">H2</button>
      <button data-heading="3" title="Heading 3">H3</button>
      <button data-heading="4" title="Heading 4">H4</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="bold" title="Bold"><b>B</b></button>
      <button data-cmd="italic" title="Italic"><i>I</i></button>
      <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
      <button data-cmd="underline" title="Underline"><u>U</u></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="copy" title="Copy"><svg viewBox="0 0 20 20" width="14" height="14"><rect x="7" y="7" width="9" height="9" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="4" width="9" height="9" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <button data-cmd="cut" title="Cut"><svg viewBox="0 0 20 20" width="14" height="14"><circle cx="5" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="15" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="6.6" y1="6.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="6.6" y1="13.5" x2="17" y2="3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button data-cmd="paste" title="Paste"><svg viewBox="0 0 20 20" width="14" height="14"><rect x="4" y="4" width="12" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="7" y="2" width="6" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="6.5" y1="10" x2="13.5" y2="10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="6.5" y1="13" x2="13.5" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="table" title="Insert table"><svg viewBox="0 0 20 20" width="14" height="14"><rect x="3" y="3" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="3" y1="8.3" x2="17" y2="8.3" stroke="currentColor" stroke-width="1.1"/><line x1="3" y1="12.7" x2="17" y2="12.7" stroke="currentColor" stroke-width="1.1"/><line x1="9.5" y1="3" x2="9.5" y2="17" stroke="currentColor" stroke-width="1.1"/></svg></button>
      <button data-cmd="code-block" title="Code block"><svg viewBox="0 0 20 20" width="14" height="14"><path d="M7 4L3 10l4 6M13 4l4 6-4 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="checklist" title="Checklist">&#9745;</button>
      <button data-cmd="ordered-list" title="Numbered list">1.</button>
      <button data-cmd="bullet-list" title="Bullet list">&#8226;</button>
      <button data-cmd="outdent" title="Decrease indent">&#8676;</button>
      <button data-cmd="indent" title="Increase indent">&#8677;</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="font-dec" title="Decrease font size">A&#8595;</button>
      <button data-cmd="font-inc" title="Increase font size">A&#8593;</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button data-cmd="find-replace" title="Find &amp; replace"><svg viewBox="0 0 20 20" width="14" height="14"><circle cx="8.3" cy="8.3" r="5.3" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <button data-cmd="delete-file" title="Delete current file" class="tb-danger"><svg viewBox="0 0 20 20" width="14" height="14"><path d="M4 6h12M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M6 6l1 11a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l1-11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div id="find-bar" class="find-bar hidden">
    <input id="find-input" type="text" placeholder="Find" />
    <input id="replace-input" type="text" placeholder="Replace" />
    <button id="find-prev" title="Previous match">&#8593;</button>
    <button id="find-next" title="Next match">&#8595;</button>
    <button id="replace-one" title="Replace this match">Replace</button>
    <button id="replace-all" title="Replace all matches">Replace All</button>
    <span id="find-status"></span>
    <button id="find-close" title="Close">&#10005;</button>
  </div>

  <div class="workspace" id="workspace">
    <div class="editor-pane" id="editor-pane">
      <div class="line-numbers hidden" id="line-numbers"></div>
      <textarea id="editor" class="editor" spellcheck="false" placeholder="Start typing Markdown..."></textarea>
    </div>
    <div class="resizer" id="resizer"></div>
    <div class="preview-pane" id="preview-pane">
      <div class="line-numbers hidden" id="line-numbers-preview"></div>
      <div id="preview" class="preview" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status-file">Untitled</span>
    <span id="status-dirty"></span>
    <span class="spacer"></span>
    <span id="status-layout">Preview Only</span>
    <span id="status-theme">Light</span>
    <span id="status-count">0 characters</span>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/turndown.js"></script>
  <script src="vendor/turndown-plugin-gfm.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
